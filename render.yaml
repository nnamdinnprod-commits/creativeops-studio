services:
  - type: web
    name: creativeops-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./creativeops.db
      - key: CAPACITY_TIGHT_THRESHOLD
        value: "85"
      - key: BRIEF_READINESS_THRESHOLD
        value: "70"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
